<button
  type="button"
  class="avatar"
  [attr.aria-expanded]="ouvert"
  aria-controls="profil-utilisateur"
  [attr.aria-label]="'Profil de ' + utilisateur.prenom + ' ' + utilisateur.nom"
  (click)="basculer()"
>
  {{ initiales }}
</button>

@if (ouvert) {
  <div id="profil-utilisateur" class="panneau">
    <p class="nom">{{ utilisateur.prenom }} {{ utilisateur.nom }}</p>
    <dl>
      <dt>Login</dt>
      <dd>{{ utilisateur.login }}</dd>

      <dt>Email</dt>
      <dd>{{ utilisateur.email }}</dd>
    </dl>
  </div>
}
