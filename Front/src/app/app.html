<header class="site-header">
  <div class="header-content">
    @if (user(); as currentUser) {
      <nav class="nav">
        <!-- exact: the list must not stay highlighted on /pollutions/new -->
        <a
          routerLink="/pollutions"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >Pollutions</a>
        <a routerLink="/pollutions/new" routerLinkActive="active" ariaCurrentWhenActive="page">Déclarer une pollution</a>
        <a routerLink="/users" routerLinkActive="active" ariaCurrentWhenActive="page">Utilisateurs</a>
      </nav>
      <app-user-profile [user]="currentUser" (logout)="logout()" />
    } @else {
      <nav class="nav">
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
        <a routerLink="/signup" routerLinkActive="active" ariaCurrentWhenActive="page">Inscription</a>
      </nav>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>

<!-- Shared by every page: ConfirmService and ToastService control them -->
<app-confirm-dialog />
<app-toast-container />
