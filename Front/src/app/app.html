<header class="site-header">
  <div class="header-content">
    @if (user(); as currentUser) {
      <nav class="nav">
        <!-- exact: the list must not stay highlighted on /pollutions/new -->
        <a
          routerLink="/pollutions"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >Pollutions</a>
        <a routerLink="/pollutions/new" routerLinkActive="active" ariaCurrentWhenActive="page">Déclarer une pollution</a>
      </nav>
      <app-user-profile [user]="currentUser" />
    } @else {
      <nav class="nav">
        <a routerLink="/signup" routerLinkActive="active" ariaCurrentWhenActive="page">Inscription</a>
      </nav>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
