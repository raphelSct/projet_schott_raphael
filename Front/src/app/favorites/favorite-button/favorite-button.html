@let active = isFavorite()(pollution.id);
@let label = active ? 'Retirer des favoris' : 'Ajouter aux favoris';

<button
  type="button"
  class="favorite"
  [class.active]="active"
  [class.with-label]="showLabel"
  [title]="label"
  [attr.aria-label]="showLabel ? null : label + ' : ' + pollution.title"
  (click)="toggle()"
>
  <span class="star" aria-hidden="true">{{ active ? '★' : '☆' }}</span>
  @if (showLabel) {
    <span>{{ label }}</span>
  }
</button>
