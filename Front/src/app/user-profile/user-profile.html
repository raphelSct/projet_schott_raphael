<button
  type="button"
  class="avatar"
  [attr.aria-expanded]="open()"
  aria-controls="user-profile-panel"
  [attr.aria-label]="'Profil de ' + user.name"
  (click)="toggle()"
>
  {{ initials }}
</button>

@if (open()) {
  <div id="user-profile-panel" class="panel">
    <p class="name">{{ user.name }}</p>
    <dl>
      <dt>Email</dt>
      <dd>{{ user.email }}</dd>
    </dl>

    <button type="button" class="logout" (click)="logout.emit()">Se déconnecter</button>
  </div>
}
